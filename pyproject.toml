[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Manuel Holtgrewe", email = "manuel.holtgrewe@medgen-mainz.de"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
# A dependency is declared in the same change that first imports it, never
# ahead of use.
dependencies = []
description = "Fetch PubMed citations from the NCBI Entrez API and render reference text"
keywords = [
    "bibliography",
    "citation",
    "entrez",
    "ncbi",
    "pubmed",
    "reference",
]
license = "MIT"
license-files = ["LICENSE"]
name = "pmid-to-citation"
# Single-sourced from src/pmid_to_citation/version.py, which release-please owns.
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"

[project.urls]
Homepage = "https://github.com/medgen-mainz/pmid-to-citation"
Documentation = "https://pmid-to-citation.readthedocs.io/en/latest/"
Changelog = "https://github.com/medgen-mainz/pmid-to-citation/blob/main/CHANGELOG.md"
Issues = "https://github.com/medgen-mainz/pmid-to-citation/issues"
Source = "https://github.com/medgen-mainz/pmid-to-citation"

[tool.hatch.version]
path = "src/pmid_to_citation/version.py"

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.0.0",
    "ruff>=0.14.2",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "syrupy>=5.0.0",
]

[tool.pyright]
# The package ships `py.typed`, so its annotations are a contract with users.
# Strict mode from the first commit keeps that contract cheap to maintain.
typeCheckingMode = "strict"
include = ["src/pmid_to_citation", "tests", "docs"]
exclude = [
    "**/__pycache__",
    "docs/_build",
]

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
line-length = 120

lint.select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
lint.ignore = [
  "E501", # line too long, handled by the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pmid_to_citation"]

[tool.ruff.lint.per-file-ignores]
# Test and Sphinx modules are not part of the public API surface, so the
# docstring rules that exist to keep that surface documented do not apply.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"docs/conf.py" = ["D100"]

[tool.pytest.ini_options]
addopts = [
  "--doctest-modules",
  "--strict-markers",
  "--strict-config",
  "-ra",
  # Tests that talk to NCBI are opt-in: CI must stay hermetic, and Entrez
  # rate-limits unauthenticated clients. Use `make test-network` to run them.
  "-m", "not network",
]
markers = [
  "network: hits the live NCBI Entrez API; deselected unless explicitly requested",
]
testpaths = ["tests", "src/pmid_to_citation"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/pmid_to_citation"]

[tool.coverage.report]
show_missing = true
# A ratchet: raise it, never lower it.
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pmid_to_citation"]

# NOTE: Do *not* use `packages` here. On the sdist target it rewrites paths and
# flattens `src/pmid_to_citation` to `pmid_to_citation` at the archive root,
# after which the wheel target's `packages = ["src/pmid_to_citation"]` matches
# nothing and hatchling silently emits a metadata-only wheel. The sdist must
# stay a faithful copy of the source tree so that `pip wheel <sdist>`
# reproduces the real wheel.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/AUTHORS.rst",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "/docs/_build",
  "**/__pycache__",
  "**/*.py[co]",
]
