# Optional but recommended: `uv run pre-commit install`
# These hooks are a fast subset of `make check`; CI remains the source of truth.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Recorded Entrez responses and syrupy snapshots must stay byte-identical
      # to what the API returned, otherwise these hooks would silently rewrite
      # the very bytes the parser tests assert on.
      - id: end-of-file-fixer
        exclude: ^(tests/data/|tests/.*/__snapshots__/)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(tests/data/|tests/.*/__snapshots__/)
      - id: trailing-whitespace
        exclude: ^(tests/data/|tests/.*/__snapshots__/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.5
    hooks:
      - id: uv-lock
