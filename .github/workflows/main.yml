name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Allows the release workflow to gate publishing on a full CI run.
  workflow_call:

# Least privilege by default; jobs opt in to more where they need it.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Build docs
        run: uv run --no-sync sphinx-build -b html docs docs/_build/html

  formatting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Run Lint
        run: |
          uv run --no-sync ruff format --check --diff src tests docs
          uv run --no-sync ruff check src tests docs

      - name: Run Type Checks
        run: uv run --no-sync pyright src tests docs

  testing:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13', '3.14']
    needs: formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"

      # The `network` marker is deselected by pytest's `addopts`, so this never
      # calls NCBI: CI must not depend on a third-party service being up, and
      # must not consume the project's Entrez rate budget.
      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --durations 5

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Declared dependency floors are a promise. Without this job they are never
  # exercised, because the lockfile always resolves to newer versions. There are
  # no runtime dependencies yet, so today this covers only the dev groups; it
  # starts earning its keep the moment a runtime dependency is added.
  minimum-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install lowest supported direct dependencies
        run: uv sync --all-groups --resolution lowest-direct

      - name: Run tests
        run: uv run --no-sync pytest --durations 5

  # Builds the real distribution artifacts and proves they are usable. Without
  # this, a malformed sdist can silently publish a metadata-only wheel that
  # installs cleanly and then fails at `import`.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Rebuild wheel from the sdist
        run: uv build --wheel --out-dir dist-from-sdist dist/*.tar.gz

      - name: Validate metadata and wheel contents
        run: |
          uvx twine check dist/* dist-from-sdist/*
          uvx check-wheel-contents dist-from-sdist/*.whl

      - name: Install sdist-built wheel into a clean environment and import it
        run: |
          uv venv /tmp/smoke --python 3.13
          uv pip install --python /tmp/smoke/bin/python dist-from-sdist/*.whl
          /tmp/smoke/bin/python -c "
          import pmid_to_citation, pathlib
          assert (pathlib.Path(pmid_to_citation.__file__).parent / 'py.typed').is_file(), 'py.typed missing from wheel'
          print('package OK:', pmid_to_citation.__version__)
          "

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
