name: Bug report
description: Report incorrect or unexpected behaviour
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: pmid-to-citation version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: pmid
    attributes:
      label: PMID
      description: The PMID that triggers the problem, if one does.
      placeholder: "31341288"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: >
        What you were trying to do, what happened, and what you expected instead.
        For a wrong citation, include both the text produced and the text you
        expected, along with the style you asked for.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: The code you ran and its output, including the full traceback.
      render: shell
    validations:
      required: true
